[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zkit"
version = "0.8.1"
description = "Fast local evidence for AI agents decompiling GameCube games and porting them with matching behavior"
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["gamecube", "decompilation", "decomp-toolkit", "mcp", "claude-code", "codex"]
dependencies = [
  "mcp>=1.30,<2",
  "psutil>=5.9; sys_platform != 'linux'",
]

[project.optional-dependencies]
ghidra = ["pyghidra>=2.1"]  # `decompile`; also needs Ghidra and its Gekko/Broadway language (see `zkit doctor`)

[project.urls]
Homepage = "https://github.com/zeroz41/gcn-zkit"

[project.scripts]
zkit = "zkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zkit = ["report.html"]
